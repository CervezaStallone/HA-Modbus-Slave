name: Bug report
description: Something in the Modbus Slave integration isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check the [README troubleshooting section](https://github.com/CervezaStallone/HA-Modbus-Slave#troubleshooting) and search existing issues.

        The fields below are required because almost every Modbus bug report hinges on the exact HA/integration version, the mapping and a debug log — without them we usually have to ask and wait for a reply before we can even start.

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.4"
    validations:
      required: true

  - type: input
    id: integration-version
    attributes:
      label: Modbus Slave integration version
      description: HACS → Modbus Slave → installed version (or the release tag / commit if installed manually)
      placeholder: "1.1.0"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Home Assistant installation method
      options:
        - Home Assistant OS
        - Home Assistant Supervised
        - Home Assistant Container / Docker
        - Home Assistant Core (venv)
    validations:
      required: true

  - type: input
    id: modbus-master
    attributes:
      label: Modbus master / client
      description: The PLC, SCADA, energy manager or tool that talks to Home Assistant
      placeholder: "e.g. Siemens S7-1200, Loxone Miniserver, Node-RED, mbpoll"
    validations:
      required: true

  - type: textarea
    id: mapping
    attributes:
      label: Mapping and request
      description: The mapping involved (entity, address, data type, writable) and what the master sends (function code, address, count / value)
      placeholder: |
        sensor.outdoor_temperature → REG 100–101 float32 (read-only)
        Master reads FC3, address 100, count 2
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what's wrong
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the raw register values or Modbus exception code the master receives, if any
    validations:
      required: true

  - type: textarea
    id: debug-log
    attributes:
      label: Debug log
      description: |
        Enable debug logging for `custom_components.modbus_slave` and `pymodbus` (Settings → Devices & services → Modbus Slave → enable debug logging, or add to `configuration.yaml`), reproduce the issue, then paste the relevant lines here. Mask/replace real IP addresses if you'd rather not share them.
      render: text
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might be relevant — network topology, firewall/VLAN setup, other Modbus tools you've tested with, etc.
    validations:
      required: false
