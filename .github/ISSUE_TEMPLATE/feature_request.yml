name: Feature request
description: Suggest an improvement or new capability for the Modbus Slave integration
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case / problem
      description: What are you trying to do, and what's stopping you today?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What would you like the integration to do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using now, or other approaches you thought about
    validations:
      required: false

  - type: input
    id: modbus-details
    attributes:
      label: Function codes / data types / entity domains involved
      description: If relevant — e.g. a function code, word order, data type or entity domain this touches
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
    validations:
      required: false
