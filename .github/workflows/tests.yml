name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # The tests load the integration in a real Home Assistant and talk to it
    # with a real Modbus client. They run at both ends of the supported range:
    # the minimum from hacs.json (the first release that ships pymodbus 3.13)
    # and the latest release, which catches helpers that HA deprecates and
    # then removes before they reach users.
    name: Run pytest (${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: minimum
            # pytest-homeassistant-custom-component 0.13.344 = Home Assistant 2026.7.0
            install: pytest-homeassistant-custom-component==0.13.344 pymodbus==3.13.1
          - ha: latest
            install: -r requirements_test.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.install }} pytest-cov

      - name: Run pytest with coverage
        run: |
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
          pytest tests/ \
            --cov=custom_components/modbus_slave \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        if: matrix.ha == 'latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
