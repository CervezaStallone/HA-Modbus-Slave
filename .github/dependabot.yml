version: 2
updates:
  # Only GitHub Actions versions (actions/checkout, setup-python, etc.) —
  # not a Python ecosystem entry: the pymodbus requirement lives in
  # custom_components/modbus_slave/manifest.json, which Dependabot doesn't
  # understand, and requirements_test.txt pins pymodbus to the version Home
  # Assistant core ships on purpose.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
